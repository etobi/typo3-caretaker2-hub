services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Wie die Provider im Agent: Jede Klasse, die EvaluatorInterface
  # implementiert, wird automatisch mitgeprüft — auch aus einer fremden
  # Extension.
  _instanceof:
    Caretaker2\Hub\Evaluation\EvaluatorInterface:
      tags: ['caretaker2.evaluator']

  Caretaker2\Hub\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Instance.php'
      - '../Classes/Domain/EnrollmentException.php'
      - '../Classes/Domain/IngestException.php'
      - '../Classes/Domain/TokenGenerator.php'
      - '../Classes/Evaluation/Finding.php'
      - '../Classes/Evaluation/EvaluationResult.php'
      - '../Classes/Evaluation/EvaluationException.php'
      - '../Classes/Evaluation/EvaluatorInterface.php'
      - '../Classes/Scheduler/SchedulerTaskException.php'

  cache.caretaker2:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['caretaker2']

  Caretaker2\Hub\Evaluation\EvaluationService:
    arguments:
      $evaluators: !tagged_iterator caretaker2.evaluator

  Caretaker2\Hub\Domain\Typo3MajorVersions:
    arguments:
      $cache: '@cache.caretaker2'

  Caretaker2\Hub\Domain\PhpVersions:
    arguments:
      $cache: '@cache.caretaker2'

  Caretaker2\Hub\Command\CleanupCommand:
    tags:
      - { name: 'console.command', command: 'caretaker2:cleanup', description: 'Entfernt Verwaistes nach gelöschten Instanzen und Gruppen', schedulable: true }

  Caretaker2\Hub\Command\EvaluateCommand:
    tags:
      - { name: 'console.command', command: 'caretaker2:evaluate', description: 'Wertet die Composer-Daten der Instanzen aus', schedulable: true }

  Caretaker2\Hub\Command\CreateEnrollmentCodeCommand:
    tags:
      - { name: 'console.command', command: 'caretaker2:enroll', description: 'Erzeugt einen Enrollment-Code zum Verbinden einer Instanz', schedulable: false }
