<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.heading"/></h1>

    <f:if condition="{message}">
        <div class="callout callout-{messageSeverity}">
            <div class="callout-content">
                <div class="callout-body">{message}</div>
            </div>
        </div>
    </f:if>

    <f:if condition="{missingTasks}">
        <div class="callout callout-warning">
            <div class="callout-content">
                <div class="callout-title"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:scheduler.title"/></div>
                <div class="callout-body">
                    <f:if condition="{schedulerAvailable}">
                        <f:then>
                            <p><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:scheduler.missing" arguments="{0: '{missingTasks}'}"/></p>
                            <form method="post" class="mb-0">
                                <button type="submit" name="installTasks" value="1" class="btn btn-default">
                                    <f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:scheduler.create"/>
                                </button>
                            </form>
                        </f:then>
                        <f:else>
                            <p class="mb-0"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:scheduler.unavailable" arguments="{0: '{missingTasks}'}"/></p>
                        </f:else>
                    </f:if>
                </div>
            </div>
        </div>
    </f:if>

    <f:if condition="{enrollmentCode}">
        <div class="callout callout-success">
            <div class="callout-content">
                <div class="callout-title"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.enroll.title"/></div>
                <div class="callout-body">
                    <p><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.enroll.intro"/></p>

                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.enroll.hubUrl"/></label>
                            <input type="text" class="form-control" readonly="readonly"
                                   onclick="this.select()" value="{hubUrl}">
                        </div>
                        <div class="col-md-3 mb-2">
                            <label class="form-label"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.enroll.code"/></label>
                            <input type="text" class="form-control" readonly="readonly"
                                   onclick="this.select()"
                                   style="font-family:monospace;letter-spacing:.1em;font-weight:bold"
                                   value="{enrollmentCode}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </f:if>

    <f:if condition="{summary.total}">
        <f:then>
            <div class="mb-3">
                <span class="badge badge-secondary"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.total" arguments="{0: summary.total}"/></span>
                <f:if condition="{summary.ok}">
                    <span class="badge badge-success"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.ok" arguments="{0: summary.ok}"/></span>
                </f:if>
                <f:if condition="{summary.attention}">
                    <span class="badge badge-secondary"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.attention" arguments="{0: summary.attention}"/></span>
                </f:if>
                <f:if condition="{summary.incomplete}">
                    <span class="badge badge-warning"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.incomplete" arguments="{0: summary.incomplete}"/></span>
                </f:if>
                <f:if condition="{summary.vulnerable}">
                    <span class="badge badge-danger"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.vulnerable" arguments="{0: summary.vulnerable}"/></span>
                </f:if>
                <f:if condition="{summary.unsupported}">
                    <span class="badge badge-danger"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.unsupported" arguments="{0: summary.unsupported}"/></span>
                </f:if>
                <f:if condition="{summary.stale}">
                    <span class="badge badge-danger"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.summary.stale" arguments="{0: summary.stale}"/></span>
                </f:if>
            </div>

            <form method="get" action="{listUri}" class="mb-3">
                <f:for each="{listParams}" as="value" key="name">
                    <input type="hidden" name="{name}" value="{value}">
                </f:for>
                <div class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label class="form-label" for="c2-filter-state"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.state"/></label>
                        <select class="form-select" id="c2-filter-state" name="filter_state">
                            <option value=""><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.any"/></option>
                            <f:for each="{filterOptions.state}" as="option">
                                <option value="{option.value}"{f:if(condition: '{filters.state} == {option.value}', then: ' selected="selected"')}>{option.label}</option>
                            </f:for>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="c2-filter-typo3"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.typo3"/></label>
                        <select class="form-select" id="c2-filter-typo3" name="filter_typo3">
                            <option value=""><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.any"/></option>
                            <f:for each="{filterOptions.typo3}" as="option">
                                <option value="{option.value}"{f:if(condition: '{filters.typo3} == {option.value}', then: ' selected="selected"')}>{option.label}</option>
                            </f:for>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="c2-filter-php"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.php"/></label>
                        <select class="form-select" id="c2-filter-php" name="filter_php">
                            <option value=""><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.any"/></option>
                            <f:for each="{filterOptions.php}" as="option">
                                <option value="{option.value}"{f:if(condition: '{filters.php} == {option.value}', then: ' selected="selected"')}>{option.label}</option>
                            </f:for>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="c2-filter-group"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.group"/></label>
                        <select class="form-select" id="c2-filter-group" name="filter_group">
                            <option value=""><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.any"/></option>
                            <f:for each="{filterOptions.group}" as="option">
                                <option value="{option.value}"{f:if(condition: '{filters.group} == {option.value}', then: ' selected="selected"')}>{option.label}</option>
                            </f:for>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-default"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.apply"/></button>
                        <f:if condition="{filterActive}">
                            <a href="{listUri}" class="btn btn-link"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.reset"/></a>
                            <span class="text-body-secondary ms-2"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.filter.showing" arguments="{0: shownCount, 1: totalCount}"/></span>
                        </f:if>
                    </div>
                </div>
            </form>

            <div class="table-fit mb-3">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.state"/></th>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.instance"/></th>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.typo3"/></th>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.php"/></th>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.context"/></th>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.findings"/></th>
                            <th><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.column.lastSeen"/></th>
                            <th class="col-control"></th>
                        </tr>
                    </thead>
                    <f:for each="{groups}" as="group">
                        <tbody>
                            <f:if condition="{showGroupHeadings}">
                                <tr class="table-active">
                                    <th colspan="8" scope="colgroup">
                                        <div class="d-flex align-items-center justify-content-between gap-2">
                                            <span>
                                                {group.title}
                                                <span class="badge badge-secondary">{group.instances -> f:count()}</span>
                                                <f:if condition="{group.description}">
                                                    <span class="fw-normal text-body-secondary ms-2">{group.description}</span>
                                                </f:if>
                                            </span>
                                            <f:if condition="{group.editUri}">
                                                <a href="{group.editUri}" class="btn btn-default btn-sm"
                                                   title="{f:translate(key: 'LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.group.edit')}">
                                                    <core:icon identifier="actions-open" size="small"/>
                                                </a>
                                            </f:if>
                                        </div>
                                    </th>
                                </tr>
                            </f:if>
                            <f:for each="{group.instances}" as="instance">
                                <tr>
                                    <td class="col-nowrap">
                                        <span class="badge badge-{instance.stateSeverity}"
                                              title="{instance.stateHint}">{instance.stateLabel}</span>
                                    </td>
                                    <td>
                                        <a href="{instance.detailUri}"><strong>{instance.title}</strong></a>
                                        <f:if condition="{instance.siteHosts}">
                                            <div class="text-body-secondary">
                                                <f:for each="{instance.siteHosts}" as="host"><div>{host}</div></f:for>
                                            </div>
                                        </f:if>
                                    </td>
                                    <td class="col-nowrap">
                                        <span class="badge badge-{instance.typo3Support.colour}"
                                              title="{instance.typo3Support.hint}">v{instance.typo3Major}</span>
                                        {instance.typo3Version}
                                    </td>
                                    <td class="col-nowrap">
                                        <span class="badge badge-{instance.phpSupport.colour}"
                                              title="{instance.phpSupport.hint}">{instance.phpVersion}</span>
                                    </td>
                                    <td class="col-nowrap">{instance.context}</td>
                                    <td class="col-nowrap">
                                        <f:for each="{instance.findingsBySeverity}" as="badge">
                                            <span class="badge badge-{badge.colour}" title="{badge.hint}">{badge.count}</span>
                                        </f:for>
                                        <f:if condition="{instance.findings.acknowledged}">
                                            <span class="badge badge-secondary"
                                                  title="{f:translate(key: 'LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.findings.acknowledged', arguments: {0: instance.findings.acknowledged})}"
                                                  style="opacity:.6">&#10003; {instance.findings.acknowledged}</span>
                                        </f:if>
                                    </td>
                                    <td class="col-nowrap">
                                        <f:if condition="{instance.lastSeen}">
                                            <f:then><f:format.date format="d.m.Y H:i">@{instance.lastSeen}</f:format.date></f:then>
                                            <f:else><span class="text-body-secondary"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.neverReported"/></span></f:else>
                                        </f:if>
                                    </td>
                                    <td class="col-control">
                                        <div class="btn-group">
                                            <a href="{instance.detailUri}" class="btn btn-default"
                                               title="{f:translate(key: 'LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.action.detail')}">
                                                <core:icon identifier="actions-eye" size="small"/>
                                            </a>
                                            <a href="{instance.editUri}" class="btn btn-default"
                                               title="{f:translate(key: 'LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.action.edit')}">
                                                <core:icon identifier="actions-open" size="small"/>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </f:for>
                </table>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <div class="callout-content">
                    <div class="callout-title"><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.empty.title"/></div>
                    <div class="callout-body">
                        <p><f:translate key="LLL:EXT:caretaker2_hub/Resources/Private/Language/locallang.xlf:list.empty.body"/></p>
                    </div>
                </div>
            </div>
        </f:else>
    </f:if>

    <form method="post" id="caretaker2-enroll"></form>

</f:section>
</html>
